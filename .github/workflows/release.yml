name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0,'app'); from version import VERSION; print(VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test and freeze application
        shell: pwsh
        run: ./build.ps1
      - name: Smoke test the compiled executable
        shell: pwsh
        run: |
          New-Item output -ItemType Directory -Force | Out-Null
          $report = Join-Path $PWD 'output/smoke.json'
          $process = Start-Process -FilePath 'dist/ZELYVARO Audio Live/ZELYVARO Audio Live.exe' -ArgumentList @('--self-test', "`"$report`"", '--gallery') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Executable timed out' }
          if ($process.ExitCode -ne 0) { throw 'Executable failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Renderer/bridge smoke test failed' }
      - name: Build Windows installer and checksum
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $file = Get-Item "output/ZelyvaroAudioLive-$version-setup.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content ($file.FullName + '.sha256') -Encoding ascii
          $portable = Join-Path $PWD "output/ZelyvaroAudioLive-$version-Windows-x64.zip"
          Compress-Archive -LiteralPath 'dist/ZELYVARO Audio Live' -DestinationPath $portable -CompressionLevel Optimal
          $zipHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $([System.IO.Path]::GetFileName($portable))" | Set-Content ($portable + '.sha256') -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ZelyvaroAudioLive-Windows-x64
          path: output/*
      - name: Publish a new stable version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; existing binaries remain unchanged.'; exit 0 }
          gh release create $tag output/*-setup.exe output/*.zip output/*.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ZELYVARO Audio Live $tag" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

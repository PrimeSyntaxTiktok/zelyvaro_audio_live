name: Windows Installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          pyinstaller --noconfirm --clean --onedir --windowed --name "ZELYVARO Audio Live" --add-data "app/wallpaper.html;." --collect-all soundcard --collect-all PySide6 app/main.py
      - name: Make installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ZelyvaroAudioLive-Windows-Setup
          path: output/*-setup.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*-setup.exe

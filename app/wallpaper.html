<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZELYVARO Audio Live</title>
<style>
:root{color-scheme:dark;--accent:#b9a0ff;--second:#6be4ff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#02040b;color:#f4f5fc;font-family:'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#visual{position:fixed;inset:0;width:100%;height:100%}#veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,#01030b44,transparent 45%,transparent 70%,#01030b88)}#ui{position:fixed;z-index:5;left:18px;right:18px;top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}button.glass{border:1px solid #ffffff29;border-radius:100px;background:#07101d99;backdrop-filter:blur(20px);color:#fff;padding:10px 13px;font-size:11px;box-shadow:0 4px 20px #0002}#sourceBtn{display:flex;align-items:center;gap:7px;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#sourceBtn .dot{width:6px;height:6px;border-radius:100%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex-shrink:0}#sourceText{overflow:hidden;text-overflow:ellipsis}#brand{position:fixed;z-index:2;top:26%;width:100%;text-align:center;pointer-events:none;padding:0 18px}#brand .edition{font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;opacity:.95}.name{margin:0;font-size:clamp(26px,9vw,72px);font-weight:650;letter-spacing:.13em;padding-left:.13em;text-shadow:0 2px 40px #0006,0 0 32px #ffffff12;line-height:1.25}.tagline{font-size:10px;letter-spacing:.35em;text-transform:uppercase;margin-top:19px;color:#c3c9d6}#footer{position:fixed;bottom:35px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;font-size:8px;letter-spacing:.22em;color:#bdc6d5a6;line-height:1.8}#footer b{display:block;font-weight:500;color:#e6e9f2;font-size:9px}.scene-number{font-size:26px;font-weight:200;letter-spacing:-.04em;color:#ffffff92}#settings{position:fixed;z-index:8;inset:76px 16px 22px;border:1px solid #ffffff25;border-radius:22px;background:#070d18ec;backdrop-filter:blur(35px);padding:22px;overflow-y:auto;box-shadow:0 25px 100px #0009;display:none}#settings.open{display:block}.panel-top{display:flex;align-items:start;justify-content:space-between;margin-bottom:22px}.overline{font-size:9px;color:#8b94a8;letter-spacing:.18em;text-transform:uppercase}h2{font-size:24px;font-weight:500;letter-spacing:-.04em;margin:4px 0 0}.close{border:0;background:none;color:#9aa2b4;font-size:24px;line-height:1}#themes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 24px}.theme{position:relative;text-align:left;min-height:92px;overflow:hidden;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:13px;background:#111a2c;transition:border-color .2s,transform .2s}.theme:hover{transform:translateY(-2px)}.theme[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.theme strong{position:relative;display:block;font-size:11px;letter-spacing:.04em;font-weight:600;margin-top:20px}.theme small{position:relative;font-size:9px;color:#c6cbd9a6}.theme .orb{position:absolute;width:85px;height:85px;right:-10px;top:-20px;border-radius:50%;opacity:.8;filter:blur(1px)}.theme[data-id=galaxy]{background:linear-gradient(135deg,#0e0b22,#322050)}.theme[data-id=galaxy] .orb{background:radial-gradient(circle at 30% 30%,#60dcff,#7844b077 45%,transparent 67%)}.theme[data-id=city]{background:repeating-linear-gradient(90deg,#081726 0px,#081726 12px,#21465c 13px,#07101e 18px)}.theme[data-id=city] .orb{border-radius:0;background:linear-gradient(0deg,#f53891,transparent);width:10px;right:25px}.theme[data-id=ember]{background:linear-gradient(120deg,#180b08,#622113)}.theme[data-id=ember] .orb{background:radial-gradient(ellipse,#ffb14b,#e04a0644,transparent 65%)}.theme[data-id=aurora]{background:linear-gradient(145deg,#061822,#154136)}.theme[data-id=aurora] .orb{background:linear-gradient(100deg,transparent,#77efad99,#aa80ee88,transparent);filter:blur(8px);transform:rotate(25deg)}.theme[data-id=abyss]{background:linear-gradient(140deg,#031922,#0b425a)}.theme[data-id=abyss] .orb{background:radial-gradient(ellipse at 50% 70%,transparent 20%,#49edfa88 32%,#96d7ffbb 36%,transparent 40%)}.theme[data-id=gold]{background:linear-gradient(130deg,#21190d,#59411a,#18120b)}.theme[data-id=gold] .orb{background:linear-gradient(130deg,transparent,#e5b762,#fff0ba,#70471b,transparent);transform:rotate(-30deg)}label.control{display:flex;justify-content:space-between;margin:18px 0 9px;font-size:11px;color:#a7b0c3}label.control output{color:#e6e9f3}input[type=range]{width:100%;height:3px;accent-color:var(--accent)}input[type=text]{width:100%;padding:11px 12px;border:1px solid #ffffff22;border-radius:9px;background:#ffffff06;color:#fff;font-size:12px}.row{display:flex;gap:9px;margin-top:21px}.row button{flex:1}#cleanBtn{color:#051018;background:var(--accent);border:none;border-radius:100px;font-size:11px;padding:11px}.hint{font-size:10px;line-height:1.7;color:#808ca2;margin:17px 0 0}#message{display:none;position:fixed;z-index:20;left:20px;right:20px;bottom:20px;padding:13px 16px;border:1px solid #ffffff22;border-radius:12px;background:#101b2aee;font-size:11px;text-align:center}#message.show{display:block}body.clean #ui,body.clean #settings,body.clean #message{display:none!important}body[data-theme=city] #brand{top:22%}body[data-theme=aurora] #brand{top:34%}body[data-theme=gold] #brand{top:34%}@media(max-height:650px){#settings{padding:16px;inset:68px 12px 12px}.theme{min-height:72px}.theme strong{margin-top:10px}#themes{margin-bottom:10px}.panel-top{margin-bottom:10px}}
</style></head><body data-theme="galaxy">
<canvas id="visual" aria-label="Décor animé réactif au son Windows"></canvas><div id="veil"></div>
<div id="ui"><button class="glass" id="sourceBtn" title="Relancer la capture de la sortie audio Windows"><span class="dot"></span><span id="sourceText">Connexion audio…</span></button><button class="glass" id="settingsBtn">◈ &nbsp; Thèmes</button></div>
<div id="brand"><div class="edition" id="edition">01 / STELLAR DRIFT</div><h1 class="name" id="brandName">ZELYVARO</h1><div class="tagline" id="tagline">Somewhere beyond the noise</div></div>
<div id="footer"><div><b id="sceneName">STELLAR DRIFT</b>ZELYVARO AUDIO LIVE</div><div class="scene-number" id="sceneNumber">01</div></div>
<section id="settings" aria-label="Personnalisation"><div class="panel-top"><div><div class="overline">Votre scène, votre univers</div><h2>Atmosphères</h2></div><button class="close" id="closeBtn" aria-label="Fermer les réglages">×</button></div><div id="themes"></div>
<label class="control" for="sensitivity">Réactivité musicale <output id="sv">1.7×</output></label><input id="sensitivity" type="range" min="0.5" max="4" step="0.1" value="1.7">
<label class="control" for="motion">Mouvement <output id="mv">1.0×</output></label><input id="motion" type="range" min="0.2" max="2" step="0.1" value="1">
<label class="control" for="particles">Densité de particules <output id="pv">160</output></label><input id="particles" type="range" min="40" max="300" step="20" value="160">
<label class="control" for="brandText">Votre nom</label><input id="brandText" type="text" value="ZELYVARO" maxlength="24">
<div class="row"><button id="demoBtn" class="glass">Aperçu musical</button><button id="cleanBtn">Mode Live · H</button></div><p class="hint">H · masquer les contrôles &nbsp; F · plein écran<br>Les décors réagissent au son de la sortie Windows. Les préférences sont enregistrées automatiquement.</p></section>
<div id="message" role="status"></div>
<script>window.jsErrors=[];addEventListener('error',e=>window.jsErrors.push(e.message));</script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="themes.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('visual');
const themes=[['galaxy','Stellar Drift','Nébuleuse · étoiles filantes','Somewhere beyond the noise','#bd9cff','#79ddff'],['city','Neon District','Pluie · ville cyberpunk','After hours. Before dawn.','#fc68b2','#64e2ff'],['ember','Ember Rise','Lave · braises en suspension','Born from the fire','#ffba79','#f76b36'],['aurora','Northern Lights','Aurore · sommets enneigés','Let the night move you','#a0f8ce','#a89af6'],['abyss','Abyssal Bloom','Méduses · bioluminescence','A world beneath the surface','#8ef1f8','#739afc'],['gold','Liquid Gold','Métal fluide · éclats dorés','Everything flows','#f1d29b','#d2a25d']];
let selected='galaxy',sensitivity=1.7,motion=1,density=160,demo=false,data=null,lastAudio=0,level=0,bass=0,high=0,beat=0,lastBeat=0,previous=0,clock=0;
window.desktopAudioActive=false;window.desktopFrameCount=0;
window.setDesktopAudio=values=>{if(demo)return;data=values;lastAudio=performance.now();window.desktopAudioActive=true;window.desktopFrameCount++;};
window.clearDesktopAudio=()=>{data=null;window.desktopAudioActive=false;};
window.setDesktopStatus=text=>{$('sourceText').textContent=text.replace('● WINDOWS : ','');$('sourceBtn').title=text+' — cliquer pour relancer';};
function save(){try{localStorage.setItem('zelyvaro-settings-v2',JSON.stringify({theme:selected,sensitivity,motion,density,name:$('brandText').value}));}catch(e){}}
window.setTheme=id=>{const i=themes.findIndex(t=>t[0]===id);if(i<0)return;selected=id;const theme=themes[i],number=String(i+1).padStart(2,'0');document.body.dataset.theme=id;document.documentElement.style.setProperty('--accent',theme[4]);document.documentElement.style.setProperty('--second',theme[5]);$('edition').textContent=number+' / '+theme[1].toUpperCase();$('sceneName').textContent=theme[1].toUpperCase();$('tagline').textContent=theme[3];$('sceneNumber').textContent=number;document.querySelectorAll('.theme').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));save();};
for(const theme of themes){const button=document.createElement('button');button.className='theme';button.dataset.id=theme[0];button.innerHTML='<span class="orb"></span><strong>'+theme[1]+'</strong><small>'+theme[2]+'</small>';button.onclick=()=>window.setTheme(theme[0]);$('themes').appendChild(button);}
let settings={};try{settings=JSON.parse(localStorage.getItem('zelyvaro-settings-v2')||'{}');}catch(e){}
for(const [id,key,fallback] of [['sensitivity','sensitivity',1.7],['motion','motion',1],['particles','density',160]]){$(id).value=settings[key]??fallback;}
$('brandText').value=typeof settings.name==='string'?settings.name:'ZELYVARO';
function values(){sensitivity=+$('sensitivity').value;motion=+$('motion').value;density=+$('particles').value;$('sv').textContent=sensitivity.toFixed(1)+'×';$('mv').textContent=motion.toFixed(1)+'×';$('pv').textContent=density;$('brandName').textContent=$('brandText').value||'ZELYVARO';}
values();window.setTheme(settings.theme||'galaxy');
for(const id of ['sensitivity','motion','particles','brandText'])$(id).oninput=()=>{values();save();};
function clean(){document.body.classList.toggle('clean');$('settings').classList.remove('open');window.desktopBridge?.setClean(document.body.classList.contains('clean'));}window.toggleClean=clean;
$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');$('closeBtn').onclick=()=>$('settings').classList.remove('open');$('cleanBtn').onclick=clean;
$('sourceBtn').onclick=()=>{demo=false;$('demoBtn').textContent='Aperçu musical';window.desktopBridge?.restartAudio();};
$('demoBtn').onclick=()=>{demo=!demo;$('demoBtn').textContent=demo?'Arrêter l’aperçu':'Aperçu musical';if(demo)$('sourceText').textContent='Aperçu musical simulé';else window.desktopBridge?.restartAudio();};
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='h')clean();if(e.key.toLowerCase()==='f')window.desktopBridge?.toggleFullscreen();if(e.key==='Escape'){$('settings').classList.remove('open');}});
if(typeof QWebChannel!=='undefined'&&typeof qt!=='undefined')new QWebChannel(qt.webChannelTransport,channel=>{window.desktopBridge=channel.objects.desktopBridge;});
const engine=new SceneEngine(canvas);window.sceneEngine=engine;
function average(a,b){if(!data)return 0;let total=0,n=0;for(let i=a;i<Math.min(b,data.length);i++){total+=data[i]/255;n++;}return total/Math.max(1,n);}
function frame(ms){const dt=Math.min((ms-previous)/1000||.016,.05);previous=ms;let low=0,mid=0,treble=0;if(demo){low=.25+Math.pow(Math.max(0,Math.sin(ms*.006)),8)*.65;mid=.3+.15*Math.sin(ms*.002);treble=.3+.1*Math.sin(ms*.009);}else if(ms-lastAudio<750){low=average(1,9);mid=average(10,150);treble=average(150,500);}const b=Math.min(1,low*sensitivity),e=Math.min(1,(low*.3+mid*.5+treble*.2)*sensitivity);bass+=(b-bass)*.17;level+=(e-level)*.1;high+=(treble-high)*.12;if(b-bass>.12&&ms-lastBeat>240){beat=1;lastBeat=ms;}beat*=.9;clock+=dt*motion*(.65+level*.55);engine.render(selected,clock,{level,bass,high,beat,density,dt});requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
